# Cloudflare — static asset deployment
# `pages_build_output_dir` is for `wrangler pages deploy` only.
# The Cloudflare Pages deploy command runs `wrangler deploy`, so we use
# the [assets] section which is what wrangler deploy expects for static files.
name = "pdfcharger"
compatibility_date = "2026-10-20"

[assets]
directory = "./out"
