name: Deploy to Cloudflare Pages

# Deployment is handled by Cloudflare Pages Git integration.
# Cloudflare connects directly to this GitHub repo and builds on every
# push to main — no API tokens or secrets are required here.
#
# Build settings configured in the Cloudflare Pages dashboard:
#   Framework preset : None
#   Build command    : npm run build
#   Output directory : out
#   NODE_VERSION     : 22
#
# To trigger a manual re-deploy, use workflow_dispatch or push to main.

on:
  workflow_dispatch:
